# Konuşma Defteri — iOS kabuğu (XcodeGen tanımı)
# Derleme: GitHub Actions (macOS) üzerinde `xcodegen generate` + `xcodebuild`.
name: KonusmaDefteri
options:
  bundleIdPrefix: io.github.mssaydam
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  KonusmaDefteri:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Konuşma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: "Konuşmaları kaydedip bu telefonda metne dönüştürmek için mikrofon gerekir. Ses telefondan dışarı gönderilmez."
        # Ekran kilitliyken kaydın sürmesi için (iOS kırmızı kayıt göstergesini gösterir)
        UIBackgroundModes: [audio]
        # Service worker (çevrimdışı açılış) için WKWebView'de uygulamaya bağlı alan adı gerekir
        WKAppBoundDomains: [mssaydam.github.io]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mssaydam.konusma
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
